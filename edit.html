<!DOCTYPE html>
<html><body style="font-family:Arial;padding:20px;">
<h2>✏️ Edit Drug - {{ drug['name'] }}</h2>
<form method="POST">
    Name: <input name="name" value="{{ drug['name'] }}" required><br><br>
    Dosage: <input name="dosage" value="{{ drug['dosage'] }}" required><br><br>
    Quantity: <input name="quantity" type="number" value="{{ drug['quantity'] }}" required><br><br>
    Price: <input name="price" type="number" step="0.01" value="{{ drug['price'] }}" required><br><br>
    Batch: <input name="batch_number" value="{{ drug['batch_number'] }}" required><br><br>
    Expiry: <input name="expiry_date" type="date" value="{{ drug['expiry_date'] }}" required><br><br>
    <button type="submit" style="background:green;color:white;padding:10px;">Save Changes</button>
    <a href="/"><button type="button">Cancel</button></a>
</form>
</body></html>
